[package]
name = "rabbit-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
# Win32_Security only because RegCreateKeyExW's signature names its
# SECURITY_ATTRIBUTES; RABBIT always passes null there.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    # WriteFile's signature names OVERLAPPED (ctrl_c.rs). Other crates in the
    # workspace happen to turn this on too, so only a build of this crate on
    # its own notices it missing.
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
# statfs, for the free space an uninstall's backup needs on another volume,
# and sigaction, for catching Ctrl+C while an uninstall runs.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[dev-dependencies]
tempfile.workspace = true
