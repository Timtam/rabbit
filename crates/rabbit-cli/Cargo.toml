[package]
name = "rabbit-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
clap.workspace = true
rabbit-core = { path = "../rabbit-core" }
# Ctrl+C during `uninstall --apply`, caught so the run stops between
# packages.
rabbit-platform = { path = "../rabbit-platform" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The install-extension tests write a ReaPack registry
# (`reapack::write_test_registry`). With feature resolver 2+ the hook stays
# out of the shipped binary.
rabbit-core = { path = "../rabbit-core", features = ["test-support"] }
tempfile.workspace = true
