[package]
name = "rabbit-ui-wxdragon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
gui = ["dep:wxdragon"]

[dependencies]
rabbit-core = { path = "../rabbit-core" }
# Only for `process::without_console_window`: the wizard opens external URLs
# through `cmd /C start` on Windows, which needs the same console-window
# suppression as the helpers rabbit-core runs.
rabbit-platform = { path = "../rabbit-platform" }
serde.workspace = true
wxdragon = { workspace = true, optional = true }

[dev-dependencies]
# The restore tests run on a made-up computer (`rollback::TestComputer`),
# and the target tests use minimal program files of each kind
# (`arch_probe::test_support`). With feature resolver 2+ the hooks stay out
# of the shipped binary.
rabbit-core = { path = "../rabbit-core", features = ["test-support"] }
tempfile.workspace = true
