[package]
name = "rabbit-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
fluent-bundle.workspace = true
# Battle-tested binary parsing for the executable-architecture probe in
# `arch_probe.rs`. Default features off, only the readers we need on:
# Mach-O (REAPER on macOS, including fat/universal binaries) and PE (REAPER
# on Windows) — keeps the dep small versus pulling in ELF, Wasm, COFF, etc.
object = { version = "0.40", default-features = false, features = ["read_core", "macho", "pe", "std"] }
rabbit-platform = { path = "../rabbit-platform" }
# Data-driven version/detection rules (HTML scrape, binary-string scan) carry
# regex patterns in the manifest. Default features (so manifest patterns can
# use normal syntax like \d / \s); the crate is already in the tree and is
# linear-time (no catastrophic backtracking), so first-party patterns are
# ReDoS-safe.
regex = "1"
reqwest.workspace = true
rustls.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
# Pure-Rust 7z reader. We need it specifically for the FFmpeg shared
# builds: Gyan.dev (x64) and tordona/ffmpeg-win-arm64 (ARM64) only ship
# the shared variant as `.7z`. Default features off skips the bzip2 C
# dep, the encryption stack (we never decrypt), the encoder, and PPMd
# (FFmpeg archives use LZMA2 which is provided by the always-present
# `lzma-rust2` transitive dep). The `util` feature is what surfaces
# `decompress_file_with_extract_fn` — we use it as the entry point for
# selective bin/ extraction.
sevenz-rust2 = { version = "0.24", default-features = false, features = ["util"] }
sha2.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
thiserror.workspace = true
unic-langid.workspace = true
zip.workspace = true

[dev-dependencies]
# Tests build solid .7z fixtures. With feature resolver 2+ the writer stays
# out of the shipped binary.
sevenz-rust2 = { version = "0.24", default-features = false, features = ["util", "compress"] }

# Windows-only: Mozilla's roots as the fallback when Windows can't build a
# trusted chain from its own store (see `http::client_builder`).
[target.'cfg(windows)'.dependencies]
webpki-root-certs = "1"

# macOS-only: renamex_np(RENAME_SWAP) for the atomic app-bundle exchange in
# the self-updater.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
